name: antora
version: 0.1.2
description: |
  AsciiDoc documentation site generator for Crystal, inspired by Antora.
  Generates static multi-component documentation sites from AsciiDoc sources.
  Supports authentication (kemal-auth, SAML v2) for protected sections.
authors:
  - Philippe Nénert <philippe@aloli.fr>
license: MIT
dependencies:
  crystal-asciidoctor:
    github: aloli-crystal/crystal-asciidoctor
    version: "~> 2.0"
  crystal-rouge:
    github: aloli-crystal/crystal-rouge
    version: "~> 4.7"
  kemal:
    github: kemalcr/kemal
    version: "~> 1.5"
  kemal-auth:
    github: aloli-crystal/kemal-auth
    version: "~> 0.1"
  crystal-saml:
    github: aloli-crystal/crystal-saml
    branch: production
development_dependencies:
  ameba:
    github: crystal-ameba/ameba
    version: "~> 1.6"
targets:
  antora:
    main: src/antora.cr
crystal: ">= 1.19.0"
